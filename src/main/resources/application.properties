spring.application.name=typing-speed-test-api

# ========================================
# Server
# ========================================

server.port=8080

# ========================================
# TiDB Cloud Database
# ========================================

spring.datasource.url=${TIDB_JDBC_URL}
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA / Hibernate
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.TiDBDialect

# ========================================
# JWT
# ========================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000